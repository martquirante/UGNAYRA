<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Card 1: Client Gradient (Cyan / Sky) -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="clientBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Card 2: Server Gradient (Royal Blue / Indigo) -->
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="serverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Card 3: Cloud Data Gradient (Emerald / Teal) -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0b1e19"/>
    </linearGradient>
    <linearGradient id="cloudBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#60a5fa" flood-opacity="0.4"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#34d399" flood-opacity="0.4"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowCyanReverse" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#34d399"/>
    </marker>
    <marker id="arrowGreenReverse" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 z" fill="#34d399"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
    .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .link-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Outer Canvas Frame -->
  <rect x="0" y="0" width="1000" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Header Section -->
  <g transform="translate(40, 36)">
    <!-- Brand Dot Accent -->
    <circle cx="8" cy="10" r="7" fill="#F5C518"/>
    <text x="24" y="16" class="title">UGNAYRA DECOUPLED SYSTEM ARCHITECTURE</text>
    <text x="24" y="34" class="subtitle">Client-Server Monorepo Topology • Production Data &amp; Security Pipeline</text>
  </g>

  <!-- ============================================================== -->
  <!-- CARD 1: STATIC FRONTEND CLIENT (LEFT)                          -->
  <!-- ============================================================== -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="345" rx="14" fill="url(#clientGrad)" stroke="url(#clientBorder)" stroke-width="2"/>
    
    <!-- Header Pill -->
    <rect x="18" y="18" width="92" height="22" rx="11" fill="#0369a1"/>
    <text x="64" y="33" text-anchor="middle" fill="#e0f2fe" class="pill-text">VERCEL SPA</text>
    
    <text x="18" y="66" fill="#38bdf8" class="card-title">Static Web Client</text>
    <text x="18" y="84" fill="#7dd3fc" class="card-sub">Presentation &amp; UI Layer</text>
    
    <!-- Divider -->
    <line x1="18" y1="96" x2="262" y2="96" stroke="#334155" stroke-width="1"/>

    <!-- Module Items -->
    <g transform="translate(18, 114)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="244" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="21" r="5" fill="#38bdf8"/>
      <text x="32" y="25" class="item-text" font-weight="600">HTML5 + CSS3 Tokens</text>
      <text x="195" y="25" fill="#94a3b8" font-size="10" font-family="sans-serif">Dark/Light</text>

      <!-- Item 2 -->
      <rect x="0" y="50" width="244" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="71" r="5" fill="#38bdf8"/>
      <text x="32" y="75" class="item-text" font-weight="600">Vanilla ES6 + Store</text>
      <text x="182" y="75" fill="#94a3b8" font-size="10" font-family="sans-serif">Zero Hash #</text>

      <!-- Item 3 -->
      <rect x="0" y="100" width="244" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="121" r="5" fill="#38bdf8"/>
      <text x="32" y="125" class="item-text" font-weight="600">jQuery 3.7 AJAX Engine</text>
      <text x="185" y="125" fill="#94a3b8" font-size="10" font-family="sans-serif">apiClient.js</text>

      <!-- Item 4 -->
      <rect x="0" y="150" width="244" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="171" r="5" fill="#38bdf8"/>
      <text x="32" y="175" class="item-text" font-weight="600">Lucide SVG Iconography</text>
      <text x="188" y="175" fill="#94a3b8" font-size="10" font-family="sans-serif">Vectors</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="18" y="306" width="244" height="24" rx="6" fill="#082f49"/>
    <text x="140" y="322" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600" font-family="sans-serif">Zero Server Overhead • CDN Cached</text>
  </g>

  <!-- ============================================================== -->
  <!-- CONNECTOR 1: CLIENT <---> BACKEND REST API                      -->
  <!-- ============================================================== -->
  <g transform="translate(320, 240)">
    <!-- Bi-directional Line -->
    <line x1="12" y1="0" x2="48" y2="0" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" marker-start="url(#arrowCyanReverse)"/>
    
    <!-- Link Badge -->
    <rect x="-6" y="-32" width="72" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowCyan)"/>
    <text x="30" y="-17" text-anchor="middle" fill="#38bdf8" class="link-text">HTTPS</text>
    <text x="30" y="24" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">REST /api/v1/*</text>
  </g>

  <!-- ============================================================== -->
  <!-- CARD 2: BACKEND REST API SERVICE (CENTER)                     -->
  <!-- ============================================================== -->
  <g transform="translate(360, 95)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="345" rx="14" fill="url(#serverGrad)" stroke="url(#serverBorder)" stroke-width="2"/>
    
    <!-- Header Pill -->
    <rect x="18" y="18" width="105" height="22" rx="11" fill="#1d4ed8"/>
    <text x="70" y="33" text-anchor="middle" fill="#eff6ff" class="pill-text">RENDER DOCKER</text>
    
    <text x="18" y="66" fill="#60a5fa" class="card-title">PHP 8.2+ REST API</text>
    <text x="18" y="84" fill="#93c5fd" class="card-sub">Application &amp; Security Core</text>
    
    <!-- Divider -->
    <line x1="18" y1="96" x2="262" y2="96" stroke="#1e3a8a" stroke-width="1"/>

    <!-- Module Items -->
    <g transform="translate(18, 114)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="244" height="42" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="1"/>
      <circle cx="16" cy="21" r="5" fill="#60a5fa"/>
      <text x="32" y="25" class="item-text" font-weight="600">Front Controller &amp; Router</text>
      <text x="195" y="25" fill="#94a3b8" font-size="10" font-family="sans-serif">PSR-4</text>

      <!-- Item 2 -->
      <rect x="0" y="50" width="244" height="42" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="1"/>
      <circle cx="16" cy="71" r="5" fill="#60a5fa"/>
      <text x="32" y="75" class="item-text" font-weight="600">Middleware Pipeline</text>
      <text x="165" y="75" fill="#94a3b8" font-size="10" font-family="sans-serif">CSRF • RBAC</text>

      <!-- Item 3 -->
      <rect x="0" y="100" width="244" height="42" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="1"/>
      <circle cx="16" cy="121" r="5" fill="#60a5fa"/>
      <text x="32" y="125" class="item-text" font-weight="600">Domain Business Services</text>
      <text x="160" y="125" fill="#94a3b8" font-size="10" font-family="sans-serif">Auth • Feed • Chat</text>

      <!-- Item 4 -->
      <rect x="0" y="150" width="244" height="42" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="1"/>
      <circle cx="16" cy="171" r="5" fill="#60a5fa"/>
      <text x="32" y="175" class="item-text" font-weight="600">PDO Prepared Queries</text>
      <text x="180" y="175" fill="#94a3b8" font-size="10" font-family="sans-serif">SQL Guard</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="18" y="306" width="244" height="24" rx="6" fill="#1e3a8a"/>
    <text x="140" y="322" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600" font-family="sans-serif">Standardized JSON Response Envelope</text>
  </g>

  <!-- ============================================================== -->
  <!-- CONNECTOR 2: BACKEND <---> CLOUD INFRASTRUCTURE               -->
  <!-- ============================================================== -->
  <g transform="translate(640, 240)">
    <!-- Bi-directional Line -->
    <line x1="12" y1="0" x2="48" y2="0" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowGreen)" marker-start="url(#arrowGreenReverse)"/>
    
    <!-- Link Badge -->
    <rect x="-8" y="-32" width="76" height="22" rx="11" fill="#0f172a" stroke="#34d399" stroke-width="1.5" filter="url(#glowGreen)"/>
    <text x="30" y="-17" text-anchor="middle" fill="#34d399" class="link-text">TLS / SQL</text>
    <text x="30" y="24" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">Pooler :5432</text>
  </g>

  <!-- ============================================================== -->
  <!-- CARD 3: CLOUD INFRASTRUCTURE & STORAGE (RIGHT)               -->
  <!-- ============================================================== -->
  <g transform="translate(680, 95)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="345" rx="14" fill="url(#cloudGrad)" stroke="url(#cloudBorder)" stroke-width="2"/>
    
    <!-- Header Pill -->
    <rect x="18" y="18" width="138" height="22" rx="11" fill="#047857"/>
    <text x="87" y="33" text-anchor="middle" fill="#d1fae5" class="pill-text">SUPABASE &amp; GOOGLE</text>
    
    <text x="18" y="66" fill="#34d399" class="card-title">Cloud Infrastructure</text>
    <text x="18" y="84" fill="#a7f3d0" class="card-sub">Data, Media &amp; Identity</text>
    
    <!-- Divider -->
    <line x1="18" y1="96" x2="262" y2="96" stroke="#065f46" stroke-width="1"/>

    <!-- Module Items -->
    <g transform="translate(18, 114)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="244" height="42" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
      <circle cx="16" cy="21" r="5" fill="#34d399"/>
      <text x="32" y="25" class="item-text" font-weight="600">PostgreSQL 15 Database</text>
      <text x="182" y="25" fill="#94a3b8" font-size="10" font-family="sans-serif">UUID • 3NF</text>

      <!-- Item 2 -->
      <rect x="0" y="50" width="244" height="42" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
      <circle cx="16" cy="71" r="5" fill="#34d399"/>
      <text x="32" y="75" class="item-text" font-weight="600">Google Identity Services</text>
      <text x="175" y="75" fill="#94a3b8" font-size="10" font-family="sans-serif">GSI OAuth 2.0</text>

      <!-- Item 3 -->
      <rect x="0" y="100" width="244" height="42" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
      <circle cx="16" cy="121" r="5" fill="#34d399"/>
      <text x="32" y="125" class="item-text" font-weight="600">Supabase Media Storage</text>
      <text x="168" y="125" fill="#94a3b8" font-size="10" font-family="sans-serif">ugnayra-media</text>

      <!-- Item 4 -->
      <rect x="0" y="150" width="244" height="42" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
      <circle cx="16" cy="171" r="5" fill="#34d399"/>
      <text x="32" y="175" class="item-text" font-weight="600">Delta-Polling Presence</text>
      <text x="178" y="175" fill="#94a3b8" font-size="10" font-family="sans-serif">Low-Latency</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="18" y="306" width="244" height="24" rx="6" fill="#064e3b"/>
    <text x="140" y="322" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600" font-family="sans-serif">Encrypted In-Transit • Foreign Key Integrity</text>
  </g>
</svg>

