<!-- ==========================================================================
     UGNAYRA — Single Community Space View
     (frontend/src/pages/communities/detail.html)
     ========================================================================== -->
<div class="feed-column-wrap" style="max-width:760px;" id="community-detail-root">
  <div class="mb-3">
    <a href="/communities" class="inline-flex items-center gap-2 text-secondary" style="font-weight:600;">
      <i data-lucide="arrow-left" class="icon-sm"></i><span>All Communities</span>
    </a>
  </div>

  <section class="community-hero">
    <div class="community-hero-cover" id="comm-detail-cover"></div>
    <div class="community-hero-content">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <div class="flex items-center gap-2 mb-2">
            <span class="badge badge-category" id="comm-detail-category"></span>
            <span class="text-xs-muted tabular-nums" id="comm-detail-counts"></span>
          </div>
          <h1 class="heading-xl" id="comm-detail-name"></h1>
        </div>
        <div id="comm-detail-membership-action"></div>
      </div>

      <p class="text-body mt-3 hidden" id="comm-detail-description"></p>

      <div
        class="mt-3 hidden"
        id="comm-detail-rules-box"
        style="padding:10px 12px;background:var(--color-canvas);border-radius:var(--radius-md);border:1px solid var(--color-border-subtle);"
      >
        <div class="text-xs-muted" style="font-weight:700;color:var(--color-navy-900);margin-bottom:4px;">
          COMMUNITY GUIDELINES
        </div>
        <div class="text-secondary" id="comm-detail-rules" style="font-size:var(--text-xs);white-space:pre-line;"></div>
      </div>
    </div>
  </section>

  <div class="filter-tabs mb-4" role="tablist">
    <button type="button" class="filter-chip is-active js-comm-detail-tab" data-tab="feed">Discussion Feed</button>
    <button type="button" class="filter-chip js-comm-detail-tab" data-tab="announcements">Community Notices</button>
    <button type="button" class="filter-chip js-comm-detail-tab" data-tab="members" id="comm-members-tab-btn">Members</button>
  </div>

  <div id="comm-composer-slot"></div>
  <div id="comm-tab-content"></div>
</div>
