<!-- ==========================================================================
     UGNAYRA — Private Messaging View (frontend/src/pages/messages/messages.html)
     2-Pane Desktop Split / Native Mobile Master-Detail Messenger
     ========================================================================== -->
<section class="messenger-shell" id="messenger-root" aria-label="Private messages">
  <!-- Left Conversation Inbox Pane -->
  <aside class="messenger-inbox-pane">
    <header class="messenger-inbox-header">
      <div class="flex items-center justify-between">
        <h1 class="heading-lg">Messages</h1>
        <button type="button" class="btn btn-primary btn-sm" id="new-conversation-btn">
          <i data-lucide="square-pen" class="icon-xs"></i><span>New Chat</span>
        </button>
      </div>
      <div class="input-wrapper has-left-icon">
        <i data-lucide="search" class="icon-sm input-icon-left"></i>
        <input
          type="search"
          id="conversation-filter-input"
          class="form-input"
          style="height:36px;font-size:var(--text-sm);"
          placeholder="Filter conversations..."
          aria-label="Filter conversations"
        />
      </div>
    </header>

    <div class="conversation-list" id="conversation-list-box">
      <div style="padding:16px;" class="text-xs-muted">Loading conversations...</div>
    </div>
  </aside>

  <!-- Right Active Thread Pane -->
  <div class="messenger-thread-pane" id="messenger-thread-pane">
    <div class="flex flex-col items-center justify-center flex-1" style="padding:32px;text-align:center;" id="messenger-empty-thread">
      <div class="empty-state-icon mb-2" data-api-icon="lucide:messages-square" aria-hidden="true">
        <i data-lucide="messages-square"></i>
      </div>
      <h2 class="heading-md">Select a conversation</h2>
      <p class="text-secondary mt-2" style="max-width:320px;">
        Choose a classmate or teacher on the left, or start a new private academic conversation.
      </p>
      <button type="button" class="btn btn-primary btn-sm mt-4" id="empty-new-chat-btn">
        <i data-lucide="user-plus" class="icon-sm"></i><span>Start Conversation</span>
      </button>
    </div>
  </div>
</section>

<!-- Active Thread HTML Template -->
<template id="tpl-active-thread">
  <header class="thread-header">
    <div class="flex items-center gap-3 min-w-0">
      <button type="button" class="btn-icon js-mobile-back-inbox" aria-label="Back to conversations">
        <i data-lucide="arrow-left" class="icon-md"></i>
      </button>
      <a href="/profile" id="thread-peer-link" class="flex items-center gap-3 min-w-0" style="text-decoration:none;">
        <span id="thread-peer-avatar"></span>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-sm truncate" id="thread-peer-name" style="font-weight:700;color:var(--color-ink-900);"></span>
            <span id="thread-peer-role-badge"></span>
          </div>
          <div class="text-xs-muted truncate" id="thread-peer-status"></div>
        </div>
      </a>
    </div>
    <div class="flex items-center gap-2">
      <!-- Realtime WebSockets & WebRTC Network Indicator -->
      <span class="rtc-network-pill" id="thread-network-badge" title="Realtime Network Active (WebSockets & WebRTC P2P Ready)">
        <span class="rtc-pulse-dot"></span>
        <span class="rtc-network-text">Realtime Network</span>
      </span>

      <!-- WebRTC Consultation Voice & Video Action Buttons -->
      <button type="button" class="btn btn-secondary btn-sm js-start-rtc-call" data-call-type="audio" title="Start WebRTC Audio Consultation" aria-label="Audio call">
        <i data-lucide="phone" class="icon-xs"></i>
      </button>
      <button type="button" class="btn btn-secondary btn-sm js-start-rtc-call" data-call-type="video" title="Start WebRTC Video Consultation" aria-label="Video call">
        <i data-lucide="video" class="icon-xs"></i>
      </button>

      <a href="/profile" id="thread-profile-btn" class="btn btn-secondary btn-sm">Profile</a>
    </div>
  </header>

  <div class="thread-messages-scroll" id="thread-messages-scroll"></div>
  <div class="typing-indicator-bar" id="thread-typing-indicator" aria-live="polite"></div>

  <form class="thread-composer" id="thread-send-form" novalidate>
    <label class="btn-icon" for="thread-attachment-input" title="Attach image" style="cursor:pointer;">
      <i data-lucide="image-plus" class="icon-md"></i>
    </label>
    <input type="file" id="thread-attachment-input" accept="image/jpeg,image/png,image/webp,image/gif" class="sr-only" />
    <textarea
      id="thread-message-input"
      class="thread-input"
      rows="1"
      maxlength="4000"
      placeholder="Write a message... (Enter to send)"
      aria-label="Message text"
    ></textarea>
    <button type="submit" class="btn btn-primary" id="thread-send-btn" aria-label="Send message">
      <i data-lucide="send" class="icon-sm"></i><span>Send</span>
    </button>
  </form>
</template>
